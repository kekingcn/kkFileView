name: Docker Multi-Arch Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '选择编译平台'
        required: true
        default: 'ALL'
        type: choice
        options:
        - ALL
        - AMD64
        - ARM64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set platform value
        id: set_platform
        run: |
          if [ "${{ github.event.inputs.platform }}" = "AMD64" ]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.platform }}" = "ARM64" ]; then
            echo "platforms=linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push kkfileview-base
        uses: docker/build-push-action@v4
        with:
          context: docker/kkfileview-base
          file: docker/kkfileview-base/Dockerfile
          platforms: ${{ steps.set_platform.outputs.platforms }}
          push: true
          tags: keking/kkfileview-base:latest

      - name: Build and push kkfileview
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.set_platform.outputs.platforms }}
          push: true
          tags: keking/kkfileview:latest